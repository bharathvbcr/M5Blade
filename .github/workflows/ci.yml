name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (macOS Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Swift & OS Version
        run: |
          sw_vers
          uname -m
          swift --version

      - name: Run Unit Tests
        run: |
          swift test

      - name: Assemble Release App Bundle
        run: |
          make app CONFIG=release

      - name: Verify Bundle & Code Signature
        run: |
          make verify

      - name: Test Release Packaging
        run: |
          make package
